# Conda environment for CoDA-GAT: training, analysis and preprocessing.
#   conda env create -f environment.yml && conda activate coda-gat
#
# Package versions used for the original training runs were not recorded,
# so most versions are not pinned here. Known versions:
#   - corrections_2026-11 analysis: Python 3.11.15, pandas 3.0.3
#     (corrections_2026-11/outputs/VALIDATION.md)
#   - preprocessing re-run from GEO: GEOparse 2.0.4, mygene 3.2.2,
#     inmoose 0.9.1 (preprocessing/README.md)
name: coda-gat
channels:
  - conda-forge
dependencies:
  - python=3.11
  - numpy
  - pandas=3.0.3     # 3.1 changed CSV float parsing. The pip step below replaces this with
                     # pandas 2.3.x (inmoose needs anndata, which requires pandas<3); the
                     # analysis-only check passes with 2.3.3 as well as with 3.0.3.
  - scipy
  - scikit-learn
  - matplotlib
  - networkx
  - pyarrow
  - openpyxl
  - tqdm
  - ipykernel        # to run preprocessing/preprocessing_clean.ipynb
  - pytorch
  - catboost
  - xgboost
  - pip
  - pip:
      - torch_geometric
      - boruta           # scripts/baselines_b3.py (BorutaPy)
      - GEOparse
      - mygene
      - inmoose
      # optional: cleanlab (flagging_v3 cross-check), coral_pytorch (CORN check)
